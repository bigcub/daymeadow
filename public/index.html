<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>daymeadow</title>
    <meta name="description" content="Count down to the days that matter." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f5f3f0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      // Apply the theme before first paint: saved choice, else the system setting.
      (function () {
        let theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch {
          // Storage unavailable; fall back to the system setting.
        }
        if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <!-- Sign-in nudge (shown only when signed out) -->
    <div class="signin-banner" id="signin-banner" hidden>
      <span id="signin-banner-text"></span>
      <div style="display: flex; gap: 8px; align-items: center">
        <button class="btn btn-outline" style="padding: 6px 14px; font-size: 0.8rem" data-action="sign-in">
          Sign in with Google
        </button>
        <button class="signin-dismiss" data-action="dismiss-banner" aria-label="Dismiss">&#x2715;</button>
      </div>
    </div>

    <header class="header">
      <a href="/" class="logo">daymeadow<span class="logo-dot">.</span></a>
      <div class="header-center">
        <div class="view-toggle" id="view-toggle">
          <button class="active" data-action="view" data-view="board" aria-pressed="true">Board</button>
          <button data-action="view" data-view="calendar" aria-pressed="false">Calendar</button>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-outline" data-action="new" aria-label="New event">
          <span class="hide-mobile">+ New event</span><span class="show-mobile">+</span>
        </button>
        <button class="btn btn-ghost" id="header-signin" data-action="sign-in" hidden>Sign in</button>
        <div class="user-pill" id="header-user" hidden>
          <span class="user-name" id="user-name"></span>
          <img class="user-avatar" id="user-avatar" alt="" referrerpolicy="no-referrer" />
        </div>
        <button class="btn-signout" id="header-signout" data-action="sign-out" hidden>Sign out</button>
        <button
          class="theme-toggle"
          id="theme-toggle"
          data-action="toggle-theme"
          title="Toggle dark mode"
          aria-label="Toggle dark mode"
        >
          ☀️
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Tag filter (shown once any event has a tag) -->
      <div class="tag-filter" id="tag-filter" role="group" aria-label="Filter by tag" hidden></div>

      <!-- Board view (cards) -->
      <div class="board-view active" id="board-view">
        <div class="grid" id="grid">
          <div class="card card-today">
            <div class="today-eyebrow">Today</div>
            <div>
              <div class="today-date" id="today-date">—</div>
              <div class="today-weekday" id="today-weekday">—</div>
            </div>
            <div class="today-footer">
              <div class="tz-dot"></div>
              <div class="tz-label" id="today-tz">—</div>
            </div>
          </div>
          <!-- Event cards are rendered by js/main.js -->
        </div>
      </div>

      <!-- Calendar view -->
      <div class="calendar-view" id="calendar-view"></div>
    </main>

    <!-- Add / edit modal -->
    <div class="overlay" id="overlay">
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div class="modal-title" id="modal-title">New event</div>
          <button class="btn-icon" data-action="close-modal" aria-label="Close">✕</button>
        </div>

        <div class="field">
          <label class="field-label" for="inp-title">Name <span class="opt">— optional</span></label>
          <input
            class="field-input"
            id="inp-title"
            type="text"
            placeholder="e.g. Summer holiday"
            autocomplete="off"
            maxlength="60"
          />
        </div>

        <div class="field">
          <label class="field-label" for="inp-date">Date</label>
          <!-- max caps the year at four digits; browsers otherwise allow up to six. -->
          <input class="field-input" id="inp-date" type="date" max="9999-12-31" required />
        </div>

        <div class="field" id="tags-field">
          <label class="field-label" for="inp-tag">Tags <span class="opt">— optional</span></label>
          <div class="field-input tag-input" data-action="focus-tag-input">
            <span class="tag-chips" id="tag-chips"></span>
            <input
              class="tag-input-field"
              id="inp-tag"
              type="text"
              list="tag-suggestions"
              placeholder="Add a tag"
              autocomplete="off"
            />
          </div>
          <datalist id="tag-suggestions"></datalist>
        </div>

        <div class="field">
          <span class="field-label" id="colour-label">Card colour</span>
          <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="colour-label">
            <button
              class="swatch cc-cream"
              role="radio"
              aria-label="Cream"
              data-action="pick-color"
              data-cc="cc-cream"
            ></button>
            <button
              class="swatch cc-sage"
              role="radio"
              aria-label="Sage"
              data-action="pick-color"
              data-cc="cc-sage"
            ></button>
            <button
              class="swatch cc-sky"
              role="radio"
              aria-label="Sky"
              data-action="pick-color"
              data-cc="cc-sky"
            ></button>
            <button
              class="swatch cc-rose"
              role="radio"
              aria-label="Rose"
              data-action="pick-color"
              data-cc="cc-rose"
            ></button>
            <button
              class="swatch cc-lavender"
              role="radio"
              aria-label="Lavender"
              data-action="pick-color"
              data-cc="cc-lavender"
            ></button>
            <button
              class="swatch cc-amber"
              role="radio"
              aria-label="Amber"
              data-action="pick-color"
              data-cc="cc-amber"
            ></button>
            <button
              class="swatch cc-slate"
              role="radio"
              aria-label="Slate"
              data-action="pick-color"
              data-cc="cc-slate"
            ></button>
            <button
              class="swatch cc-mint"
              role="radio"
              aria-label="Mint"
              data-action="pick-color"
              data-cc="cc-mint"
            ></button>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-outline" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary" data-action="save-event">Save event</button>
        </div>
      </div>
    </div>

    <!-- Delete confirm -->
    <div class="confirm-overlay" id="confirm-overlay">
      <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="confirm-title" id="confirm-title">Remove this event?</div>
        <div class="confirm-body">This can't be undone.</div>
        <div class="confirm-actions">
          <button class="btn btn-outline" data-action="close-confirm">Cancel</button>
          <button class="btn btn-danger" data-action="confirm-delete">Remove</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
